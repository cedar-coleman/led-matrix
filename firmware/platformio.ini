; Strength Tank LED wall firmware.
;
; Environments:
;   wall         the full firmware (flash this one)
;   display_dev  display half only; src/stubs/net_stubs.cpp stands in for the network half
;   net_dev      network half only; src/stubs/display_stubs.cpp stands in for the display half
;   native       host build of lib/render for the pixel-parity tests (pio test -e native)
;
; Build:  ../.tools/pio-venv/bin/pio run -e wall

[platformio]
default_envs = wall

[common]
; pioarduino = Arduino-ESP32 core 3.x for PlatformIO. Pinned to a stable release.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3-N32R16: 32 MB octal flash, 16 MB octal PSRAM.
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_build.psram_type = opi
board_build.partitions = partitions_32MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DNO_GFX
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
  -Iinclude
  ; AsyncTCP's task on core 0 with the rest of the network half; core 1 is the render task's.
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps =
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.1.0
  bitbank2/AnimatedGIF@2.2.3
  bitbank2/JPEGDEC@1.8.4
  esp32async/ESPAsyncWebServer@3.12.1
  esp32async/AsyncTCP@3.5.0
  bblanchon/ArduinoJson@7.4.3

[env:wall]
extends = common
build_src_filter = +<*> -<stubs/>
; Gzips ../web/ into src/net/web_assets.gen.cpp: the console ships inside the app image.
extra_scripts = pre:scripts/embed_web.py

[env:display_dev]
extends = common
build_src_filter = +<*> -<net/> -<stubs/display_stubs.cpp>
; Display bring-up switches (also work in `wall`), e.g.
;   PLATFORMIO_BUILD_FLAGS="-DWALL_TEST_PATTERN" pio run -e display_dev -t upload
;   -DWALL_TEST_PATTERN     panel numbers, up arrows and borders instead of content (Phase 0)
;   -DWALL_DRIVER_FM6126A   FM6126A init sequence if SHIFTREG leaves the panels blank
;   -DWALL_COLOR_DEPTH=8    colour depth in bits (default 6)

[env:net_dev]
extends = common
build_src_filter = +<*> -<display/> -<stubs/net_stubs.cpp>
extra_scripts = pre:scripts/embed_web.py

[env:native]
platform = native
build_unflags = -std=gnu++11
build_flags = -std=c++17 -DWALL_NATIVE -Iinclude
lib_deps = bblanchon/ArduinoJson@7.4.3
test_framework = unity
build_src_filter = -<*>
