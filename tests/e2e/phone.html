<!doctype html>
<meta charset="utf-8">
<title>phone width</title>
<style>body{margin:0;background:#000} iframe{border:0;width:390px;height:1700px;display:block}</style>
<iframe id="f"></iframe>
<script>
// phone.html#tab or phone.html#tab&act=name: the act puts the page in a state worth a screenshot.
const [tab, ...rest] = location.hash.slice(1).split('&');
const params = new URLSearchParams(rest.join('&'));
const act = params.get('act');
const PIN = '246813';
// The frame shares this page's session storage, so the console starts with the PIN remembered.
if (params.get('pin')) sessionStorage.setItem('wall_admin_pin', params.get('pin'));
const f = document.getElementById('f');
const put = (path, body, pin, method = 'PUT') =>
  fetch(path, { method, body: JSON.stringify(body), headers: { 'Content-Type': 'application/json', 'X-Admin-Pin': pin } });
// Run before the console loads, so it opens on the state the screenshot is for.
const before = {
  // The real wall switched off by hand: the Wall tab says so and the preview carries on.
  asleep: () => put('/api/control', { action: 'sleep' }, PIN, 'POST'),
};
Promise.resolve(before[act]?.()).finally(() => (f.src = '/#' + tab));
const acts = {
  // Raise one lift and break another, so the save bar, the green "new PR" outline and
  // the red invalid box all show.
  unsaved(doc) {
    const inputs = doc.querySelectorAll('#ath-table td.num input');
    inputs[0].value = '95';
    inputs[0].dispatchEvent(new Event('input', { bubbles: true }));
    inputs[1].value = '112.3';
    inputs[1].dispatchEvent(new Event('input', { bubbles: true }));
  },
  find(doc) {
    const q = doc.getElementById('ath-filter');
    q.value = 'jess';
    q.dispatchEvent(new Event('input', { bubbles: true }));
  },
  // The schedule card mid-edit: switched on, Sunday off, a second Saturday time, and
  // Tuesday ending before it starts, so the inline error shows.
  schedule(doc) {
    const fire = (el, type) => el.dispatchEvent(new Event(type, { bubbles: true }));
    doc.getElementById('sch-enabled').click();
    doc.querySelector('#sch-day-sun input[type="checkbox"]').click();
    doc.querySelector('#sch-day-sat button.add').click();
    const tue = doc.querySelectorAll('#sch-day-tue input[type="time"]');
    tue[1].value = '04:30';
    fire(tue[1], 'input');
    doc.getElementById('sch-card').scrollIntoView();
  },
  // Wall tab: the preview held on the New PRs screen with several lifts. Rotation tab: the
  // New PRs row scrolled into view.
  newprs(doc) {
    if (tab === 'rotation') {
      const row = [...doc.querySelectorAll('#rot-list li')].find((li) => li.querySelector('.title')?.textContent === 'New PRs');
      return row ? row.scrollIntoView() : setTimeout(() => acts.newprs(doc), 50);
    }
    const b = [...doc.querySelectorAll('#pv-strip button')].find((x) => /^New PR: the_peoples_master/.test(x.title));
    if (!b) return setTimeout(() => acts.newprs(doc), 50);
    b.click();
  },
  // Notices: the first announcement mid-edit with curly quotes, a dash and an emoji, so the
  // "shows as ?" warning and its "Replace with plain characters" button show.
  ascii(doc) {
    const t = doc.querySelector('#ann-list textarea');
    if (!t) return setTimeout(() => acts.ascii(doc), 50);
    t.value = 'Don\u2019t miss \u201cFight Gone Bad\u201d on Friday \u2014 \ud83d\udcaa';
    t.dispatchEvent(new Event('input', { bubbles: true }));
    t.closest('li').scrollIntoView();
  },
  // Wall tab: the preview held on the second announcement (dots under the text). Rotation
  // tab: the Announcements row scrolled into view.
  announce(doc) {
    if (tab === 'rotation') {
      const row = [...doc.querySelectorAll('#rot-list li')].find((li) => li.querySelector('.title')?.textContent === 'Announcements');
      return row ? row.scrollIntoView() : setTimeout(() => acts.announce(doc), 50);
    }
    const b = [...doc.querySelectorAll('#pv-strip button')].find((x) => x.title === 'Announcement 3 of 3');
    if (!b) return setTimeout(() => acts.announce(doc), 50);
    b.click();
  },
  diag(doc) {
    doc.getElementById('diag').open = true;
    doc.getElementById('diag').scrollIntoView();
  },
  // Someone else saves first: the save bar offers "Load the latest" and the edit stays.
  async stale(doc) {
    const input = doc.querySelector('#ath-table td.num input');
    input.value = '99';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    const now = await (await fetch('/api/athletes')).json();
    await put('/api/athletes', now, PIN);
    doc.getElementById('ath-save').click();
  },
  // Five wrong PINs from this computer, then a save: the lockout banner.
  async locked(doc) {
    for (let i = 0; i < 5; i++) await put('/api/settings', { brightness: 40 }, '000000');
    const input = doc.querySelector('#ath-table td.num input');
    input.value = '99';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    doc.getElementById('ath-save').click();
  },
};
f.addEventListener('load', () => {
  if (!acts[act]) return;
  const doc = f.contentDocument;
  const wait = () => (doc.querySelector('#ath-table tbody tr') ? acts[act](doc) : setTimeout(wait, 50));
  wait();
});
</script>
