stroke-width="2"/><circle cx="661.5" cy="232.0" r="2.2" fill="#1f6fd1" stroke="none" stroke-width="2"/><circle cx="669.0" cy="218.0" r="2.2" fill="#1f6fd1" stroke="none" stroke-width="2"/><circle cx="669.0" cy="232.0" r="2.2" fill="#1f6fd1" stroke="none" stroke-width="2"/><circle cx="676.5" cy="218.0" r="2.2" fill="#1f6fd1" stroke="none" stroke-width="2"/><circle cx="676.5" cy="232.0" r="2.2" fill="#1f6fd1" stroke="none" stroke-width="2"/><text x="970" y="271.0" font-size="18" text-anchor="middle" fill="#1f6fd1" font-weight="bold" font-family="Helvetica, Arial, sans-serif">IN</text><text x="650" y="271.0" font-size="18" text-anchor="middle" fill="#1f6fd1" font-weight="bold" font-family="Helvetica, Arial, sans-serif">OUT</text><polyline points="750.0,150 750.0,190" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="850.0,170 800.0,170" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="880.0" y="176" font-size="14" text-anchor="start" fill="#8a8a8a" font-weight="normal" font-family="Helvetica, Arial, sans-serif">printed arrows</text><rect x="774.0" y="275.0" width="72" height="26" rx="0" fill="white" stroke="#d62828" stroke-width="2" fill-opacity="1"/><circle cx="786.0" cy="288.0" r="4" fill="#d62828" stroke="none" stroke-width="2"/><circle cx="802.0" cy="288.0" r="4" fill="#d62828" stroke="none" stroke-width="2"/><circle cx="818.0" cy="288.0" r="4" fill="#222222" stroke="none" stroke-width="2"/><circle cx="834.0" cy="288.0" r="4" fill="#222222" stroke="none" stroke-width="2"/><text x="810.0" y="325.0" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">5 V socket: 2 x +5 V (red), 2 x GND (black)</text><text x="60" y="395" font-size="16" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">How to tell IN from OUT: the sideways arrow on the back points from IN to OUT, and the up arrow shows</text><text x="60" y="418" font-size="16" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">which way is up. Seen from behind, an upright panel's IN is on the left; upside down, it is on the right.</text><text x="60" y="441" font-size="16" text-anchor="start" fill="#d62828" font-weight="normal" font-family="Helvetica, Arial, sans-serif">If your panels are printed differently, follow the arrows, not this drawing: data always goes OUT -&gt; IN.</text><text x="1320" y="92" font-size="20" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Board on panel 1 (rear top-left)</text><rect x="1150" y="120" width="340" height="200" rx="0" fill="#fafafa" stroke="#8a8a8a" stroke-width="3" fill-opacity="1"/><text x="1320" y="345" font-size="14" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-family="Helvetica, Arial, sans-serif">panel 1, upright</text><rect x="1180" y="180" width="120" height="100" rx="6" fill="#f08c00" stroke="#222222" stroke-width="2" fill-opacity="0.95"/><text x="1240" y="220" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Waveshare</text><text x="1240" y="240" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">ESP32-S3</text><text x="1240" y="260" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">50 x 42 mm</text><rect x="1184" y="186" width="18" height="22" rx="0" fill="#555" stroke="#222222" stroke-width="1" fill-opacity="1"/><rect x="1184" y="216" width="18" height="22" rx="0" fill="#555" stroke="#222222" stroke-width="1" fill-opacity="1"/><text x="1176" y="202" font-size="12" text-anchor="end" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">USB-C data</text><text x="1176" y="232" font-size="12" text-anchor="end" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">USB-C power</text><circle cx="1290" cy="190" r="7" fill="white" stroke="#d62828" stroke-width="2"/><circle cx="1290" cy="270" r="7" fill="white" stroke="#222222" stroke-width="2"/><polyline points="1297,190 1410,160 1480,160" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1297,270 1410,300 1480,300" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="1390" y="150" width="36" height="18" rx="3" fill="#f2c14e" stroke="#222222" stroke-width="2" fill-opacity="1"/><text x="1408" y="142" font-size="12" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">2 A</text><text x="1495" y="165" font-size="13" text-anchor="start" fill="#d62828" font-weight="normal" font-family="Helvetica, Arial, sans-serif">+5 V</text><text x="1495" y="182" font-size="13" text-anchor="start" fill="#d62828" font-weight="normal" font-family="Helvetica, Arial, sans-serif">from supply A</text><text x="1495" y="305" font-size="13" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">GND</text><text x="1495" y="322" font-size="13" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">from supply A</text><text x="1320" y="400" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Screen-power M3 terminals: 5 V (top) and GND (bottom)</text><text x="1320" y="420" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">The board's back has a keyed 2 x 8 socket that</text><text x="1320" y="438" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">plugs straight onto panel 1's IN header.</text><text x="60" y="560" font-size="16" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Ribbons: panel to panel in the same row, use the 20 cm ribbons that came with the panels (IN and OUT are about 10 cm apart).</text><text x="60" y="590" font-size="16" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Row to row (panel 4 to 5, panel 8 to 9) the headers are about 16 cm apart vertically: use a 30 cm ribbon. You need two.</text><text x="60" y="620" font-size="16" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Power: every panel's own lead plugs into its 5 V socket; the other end goes into its supply's half of the two DIN blocks.</text><text x="60" y="650" font-size="16" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Board power: plug in the 2 A-fused lead only when the laptop is NOT on USB, or leave it off and power the board from USB while testing.</text></svg>
