<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 900" width="1640" height="900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect width="1640" height="900" fill="white"/><text x="820" y="40" font-size="26" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Mounting and cooling (side section, not to scale)</text><rect x="100" y="80" width="40" height="760" rx="0" fill="#d8cbb8" stroke="#8a8a8a" stroke-width="2" fill-opacity="1"/><text x="120" y="866" font-size="16" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">wall</text><rect x="140" y="150" width="20" height="40" rx="0" fill="#b08968" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="140" y="470" width="20" height="40" rx="0" fill="#b08968" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="160" y="110" width="18" height="480" rx="0" fill="#888" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="178" y="110" width="16" height="480" rx="0" fill="#333" stroke="#222222" stroke-width="2" fill-opacity="1"/><polyline points="204,560 204,510" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="204,440 204,390" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="204,320 204,270" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="204,200 204,150" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="150,170 324,135" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="140" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">wooden frame: 1x2 stiles and rails (19 mm each), hung on the wall</text><polyline points="169,300 324,215" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="220" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">printed junction mounts on the panels' M3 posts, screwed to the rails from behind</text><polyline points="186,380 324,295" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="300" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">LED panels, face out (about 15 mm deep)</text><polyline points="204,450 324,375" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="380" font-size="15" text-anchor="start" fill="#e07a5f" font-weight="normal" font-family="Helvetica, Arial, sans-serif">warm air rises off the panels' backs</text><polyline points="160,600 160,680" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,4"/><polyline points="162,640 324,465" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="470" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">100 mm or more between the bottom of the panels and the supplies</text><rect x="155" y="690" width="12" height="140" rx="0" fill="#b8b8b8" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="140" y="700" width="15" height="10" rx="0" fill="#666" stroke="#222222" stroke-width="1" fill-opacity="1"/><rect x="140" y="810" width="15" height="10" rx="0" fill="#666" stroke="#222222" stroke-width="1" fill-opacity="1"/><rect x="167" y="700" width="48" height="120" rx="0" fill="#e9e9e9" stroke="#222222" stroke-width="2" fill-opacity="1"/><text x="191" y="768" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">PSU</text><polyline points="232,836 232,690" fill="none" stroke="#009696" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4" marker-end="url(#arrow)"/><polyline points="246,836 246,690" fill="none" stroke="#009696" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4" marker-end="url(#arrow)"/><polyline points="260,836 260,690" fill="none" stroke="#009696" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4" marker-end="url(#arrow)"/><polyline points="148,846 148,690" fill="none" stroke="#009696" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4" marker-end="url(#arrow)"/><polyline points="148,710 324,555" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="560" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">the crossbar holds the supply off the wall: air flows behind it too</text><polyline points="161,760 324,595" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="600" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">1x3 wooden crossbar plus a small adapter (no extra plate needed for the LRS-100)</text><polyline points="191,790 324,635" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="640" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">supply, base bolted to the adapter (2 x M3, max 3 mm into the case)</text><polyline points="260,700 324,675" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="330" y="680" font-size="15" text-anchor="start" fill="#009696" font-weight="normal" font-family="Helvetica, Arial, sans-serif">cool air in at the bottom, out at the top</text><text x="330" y="702" font-size="15" text-anchor="start" fill="#009696" font-weight="normal" font-family="Helvetica, Arial, sans-serif">keep 25 mm clear around the supply's mesh</text><text x="1300" y="100" font-size="20" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Supply mounting, front view (two LRS-100-5)</text><rect x="1000" y="440" width="600" height="22" rx="0" fill="#dcb98f" stroke="#8a5a2b" stroke-width="2" fill-opacity="1"/><text x="1300" y="490" font-size="15" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">1x3 crossbar across the stile extensions</text><rect x="1110" y="420" width="86" height="50" rx="3" fill="#b8b8b8" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><rect x="1050" y="270" width="206" height="155" rx="4" fill="#f8f8f8" stroke="#222222" stroke-width="2" fill-opacity="1"/><text x="1153" y="330" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Supply A</text><text x="1153" y="352" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-family="Helvetica, Arial, sans-serif">129 x 97 x 30 mm</text><text x="1153" y="372" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-family="Helvetica, Arial, sans-serif">2 x M3 in the base</text><rect x="1046" y="270" width="30" height="155" rx="0" fill="none" stroke="#d62828" stroke-width="2" fill-opacity="1" stroke-dasharray="5,4"/><text x="1060" y="262" font-size="12" text-anchor="middle" fill="#d62828" font-weight="normal" font-family="Helvetica, Arial, sans-serif">terminal cover</text><rect x="1120" y="160" width="60" height="24" rx="4" fill="#f2c14e" stroke="#222222" stroke-width="2" fill-opacity="1"/><text x="1150" y="152" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">20 A fuse</text><rect x="1400" y="420" width="86" height="50" rx="3" fill="#b8b8b8" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><rect x="1340" y="270" width="206" height="155" rx="4" fill="#f8f8f8" stroke="#222222" stroke-width="2" fill-opacity="1"/><text x="1443" y="330" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Supply B</text><text x="1443" y="352" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-family="Helvetica, Arial, sans-serif">129 x 97 x 30 mm</text><text x="1443" y="372" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-family="Helvetica, Arial, sans-serif">2 x M3 in the base</text><rect x="1336" y="270" width="30" height="155" rx="0" fill="none" stroke="#d62828" stroke-width="2" fill-opacity="1" stroke-dasharray="5,4"/><text x="1350" y="262" font-size="12" text-anchor="middle" fill="#d62828" font-weight="normal" font-family="Helvetica, Arial, sans-serif">terminal cover</text><rect x="1410" y="160" width="60" height="24" rx="4" fill="#f2c14e" stroke="#222222" stroke-width="2" fill-opacity="1"/><text x="1440" y="152" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">20 A fuse</text><rect x="1230" y="190" width="140" height="40" rx="4" fill="#555" stroke="#222222" stroke-width="2" fill-opacity="1"/><text x="1300" y="215" font-size="13" text-anchor="middle" fill="white" font-weight="normal" font-family="Helvetica, Arial, sans-serif">IEC inlet + switch</text><text x="1300" y="255" font-size="13" text-anchor="middle" fill="#8a8a8a" font-weight="normal" font-family="Helvetica, Arial, sans-serif">100 mm between supplies</text><text x="1000" y="600" font-size="18" text-anchor="start" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">If you 3D print a cradle instead:</text><text x="1000" y="630" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">- Print a cradle and a terminal cover, not a closed box.</text><text x="1000" y="654" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">  Leave the supply's mesh top and sides open.</text><text x="1000" y="678" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">- PETG at least; ASA, ABS or PC is better. PLA softens</text><text x="1000" y="702" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">  around 55-60 C, which a loaded supply's case can reach.</text><text x="1000" y="726" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">- Stand the supply off the print by 5-10 mm for airflow.</text><text x="1000" y="750" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">- Vents low and high, so warm air rises out (chimney).</text><text x="1000" y="774" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">- Cover the AC terminals fully; clamp the cord.</text><text x="1000" y="798" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">- Mount it below the wall, never squeezed behind panels.</text></svg>
