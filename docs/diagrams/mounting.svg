<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 760" width="1640" height="760"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect width="1640" height="760" fill="white"/><text x="820" y="40" font-size="26" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Mounting and cooling</text><text x="250" y="90" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Side section (not to scale)</text><rect x="80" y="110" width="40" height="560" rx="0" fill="#d8cbb8" stroke="#8a8a8a" stroke-width="2" fill-opacity="1"/><text x="100" y="700" font-size="16" text-anchor="middle" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">wall</text><rect x="120" y="130" width="45" height="70" rx="0" fill="none" stroke="#009696" stroke-width="2" fill-opacity="1" stroke-dasharray="5,3"/><rect x="120" y="580" width="45" height="40" rx="0" fill="none" stroke="#009696" stroke-width="2" fill-opacity="1" stroke-dasharray="5,3"/><rect x="165" y="120" width="20" height="510" rx="0" fill="#c9ced6" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="165" y="280" width="20" height="20" rx="0" fill="#aeb6bf" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="185" y="277" width="9" height="26" rx="0" fill="#f08c00" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><rect x="165" y="450" width="20" height="20" rx="0" fill="#aeb6bf" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="185" y="447" width="9" height="26" rx="0" fill="#f08c00" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><rect x="194" y="120" width="15" height="510" rx="0" fill="#333" stroke="#222222" stroke-width="2" fill-opacity="1"/><rect x="129" y="412" width="33" height="97" rx="0" fill="none" stroke="#222222" stroke-width="2" fill-opacity="1" stroke-dasharray="4,3"/><polyline points="125,650 125,580" fill="none" stroke="#009696" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="219,610 219,550" fill="none" stroke="#e07a5f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="125,470 125,400" fill="none" stroke="#009696" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="219,430 219,370" fill="none" stroke="#e07a5f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="125,290 125,220" fill="none" stroke="#009696" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="219,250 219,190" fill="none" stroke="#e07a5f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="142,160 304,135" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="140" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">printed wall block, 45 mm: keyhole hanger at the top of each end stile</text><polyline points="142,600 304,175" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="180" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">bumper block at the bottom of each end stile</text><polyline points="175,230 304,215" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="220" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">end stile (2020), in the same plane as the rails</text><polyline points="175,290 304,255" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="260" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">seam rail (2020), directly behind the panels</text><polyline points="189,295 304,295" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="300" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">junction mount, 12 mm: M5 x 25 from the frame's back into its insert</text><polyline points="201,360 304,335" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="340" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">LED panels, face out (about 15 mm deep)</text><polyline points="145,470 304,395" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="400" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">supply on the lower seam rail's back (dashed)</text><polyline points="219,540 304,435" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="440" font-size="15" text-anchor="start" fill="#e07a5f" font-weight="normal" font-family="Helvetica, Arial, sans-serif">warm air off the panels' backs</text><polyline points="125,630 304,475" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="480" font-size="15" text-anchor="start" fill="#009696" font-weight="normal" font-family="Helvetica, Arial, sans-serif">cooler air in at the bottom, up behind the frame and past the supplies</text><text x="310" y="530" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Wall to panel face: about 93 mm. Nothing below or beside the screen.</text><text x="310" y="556" font-size="15" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">The gap stays open at the top, bottom and sides: don't box it in.</text><text x="1300" y="100" font-size="18" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Lower seam rail from behind (half scale)</text><rect x="1010.0" y="200" width="610.0" height="10" rx="0" fill="#aeb6bf" stroke="#3d4650" stroke-width="1.5" fill-opacity="1"/><rect x="1000.0" y="140" width="10" height="130" rx="0" fill="#c9ced6" stroke="#5c6670" stroke-width="1.5" fill-opacity="1"/><rect x="1620.0" y="140" width="10" height="130" rx="0" fill="#c9ced6" stroke="#5c6670" stroke-width="1.5" fill-opacity="1"/><rect x="1202.5" y="140" width="10" height="60" rx="0" fill="#c9ced6" stroke="#5c6670" stroke-width="1.5" fill-opacity="1"/><rect x="1417.5" y="140" width="10" height="60" rx="0" fill="#c9ced6" stroke="#5c6670" stroke-width="1.5" fill-opacity="1"/><rect x="1085.0" y="181" width="64.5" height="48" rx="3" fill="#f8f8f8" stroke="#222222" stroke-width="1.5" fill-opacity="0.9"/><text x="1117.0" y="175" font-size="12" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Supply A</text><rect x="1485.0" y="181" width="64.5" height="48" rx="3" fill="#f8f8f8" stroke="#222222" stroke-width="1.5" fill-opacity="0.9"/><text x="1517.0" y="175" font-size="12" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Supply B</text><rect x="1323.0" y="195" width="64" height="20" rx="0" fill="#fde3c4" stroke="#222222" stroke-width="1.5" fill-opacity="1"/><text x="1355.0" y="175" font-size="12" text-anchor="middle" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">blocks</text><circle cx="1003.5" cy="205" r="5" fill="#f08c00" stroke="#222222" stroke-width="2"/><circle cx="1155.0" cy="205" r="5" fill="#f08c00" stroke="#222222" stroke-width="2"/><circle cx="1315.0" cy="205" r="5" fill="#f08c00" stroke="#222222" stroke-width="2"/><circle cx="1475.0" cy="205" r="5" fill="#f08c00" stroke="#222222" stroke-width="2"/><circle cx="1626.5" cy="205" r="5" fill="#f08c00" stroke="#222222" stroke-width="2"/><circle cx="1079.5" cy="205" r="4" fill="white" stroke="#f08c00" stroke-width="2"/><circle cx="1239.5" cy="205" r="4" fill="white" stroke="#f08c00" stroke-width="2"/><circle cx="1399.5" cy="205" r="4" fill="white" stroke="#f08c00" stroke-width="2"/><circle cx="1559.5" cy="205" r="4" fill="white" stroke="#f08c00" stroke-width="2"/><text x="1000" y="300" font-size="14" text-anchor="start" fill="#222222" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Positions from the wall's left edge, seen from behind:</text><text x="1000" y="324" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">supply A 180-309 mm, blocks 656-784 mm, supply B 980-1109 mm.</text><text x="1000" y="348" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Each sits between mount screws (orange), clear of the struts.</text><text x="1000" y="372" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Supplies: base bolted to an adapter (2 x M3, at most 3 mm into the case),</text><text x="1000" y="396" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">adapter to the rail's rear slot with M5 T-nuts.</text><text x="1000" y="420" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Blocks: M3 screws through their 4 mm holes into M3 T-nuts.</text><text x="1000" y="444" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Fuses: inline on each +V feed, close to the supply.</text><text x="1000" y="468" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">AC: a switched IEC inlet on an end stile near the bottom, or a cord</text><text x="1000" y="492" font-size="14" text-anchor="start" fill="#222222" font-weight="normal" font-family="Helvetica, Arial, sans-serif">with an inline switch; cover the supplies' AC terminals.</text></svg>
